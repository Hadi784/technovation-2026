services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: technovation
      POSTGRES_DB: technovation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - exhibition-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U technovation -d technovation"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  exhibition-db:
